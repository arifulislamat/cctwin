[package]
name = "cctwin"
version = "0.1.2"
edition = "2024"
description = "Menu bar app to switch Claude Code between Claude accounts you own"
license = "MIT"
repository = "https://github.com/arifulislamat/cctwin"
homepage = "https://github.com/arifulislamat/cctwin"
readme = "README.md"
categories = ["command-line-utilities"]
rust-version = "1.89"
include = ["src/**", "tests/**", "README.md", "LICENSE", "CHANGELOG.md"]
keywords = ["claude", "claude-code", "macos", "menu-bar"]

[dependencies]
anyhow = "1.0.104"
global-hotkey = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37"
toml = "1.1.8"
tray-icon = "0.26"

[profile.release]
lto = true
codegen-units = 1
strip = true

