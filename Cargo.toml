[package]
name = "cctwin"
version = "0.1.3"
edition = "2024"
description = "Menu bar app to switch Claude Code between Claude accounts you own"
license = "MIT"
repository = "https://github.com/arifulislamat/cctwin"
homepage = "https://github.com/arifulislamat/cctwin"
readme = "README.md"
categories = ["command-line-utilities"]
rust-version = "1.89"
include = ["src/**", "tests/**", "packaging/cctwin.icns", "README.md", "LICENSE", "CHANGELOG.md"]
keywords = ["claude", "claude-code", "macos", "menu-bar"]

[dependencies]
anyhow = "1.0.104"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "NSAlert", "NSApplication", "NSAttributedString", "NSParagraphStyle", "NSButton", "NSButtonCell", "NSCell", "NSControl",
    "NSColor", "NSFont", "NSGraphics", "NSImage", "NSImageView", "NSResponder",
    "NSRunningApplication", "NSText", "NSTextField", "NSView", "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "NSAttributedString", "NSData", "NSDictionary", "NSGeometry", "NSObject", "NSString", "NSURL",
] }
global-hotkey = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37"
toml = "1.1.8"
tray-icon = "0.26"

[profile.release]
lto = true
codegen-units = 1
strip = true

