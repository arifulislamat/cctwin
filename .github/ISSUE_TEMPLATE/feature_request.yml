name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that you can't today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: markdown
    attributes:
      value: >
        Note: cctwin never reads login tokens and never switches accounts on its own.
        Requests for automatic rotation or usage tracking with your tokens are out of scope.
